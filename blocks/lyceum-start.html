<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інакші — Ліцеї · Як почати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400..900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font-head: 'Geologica', system-ui, sans-serif;
    --gutter: max(24px, calc((100% - 1248px) / 2));
    --font-body: 'Nunito', system-ui, sans-serif;

    --surface: #FFFFFF;
    --alt:     #EBEEF8;
    --text:    #14132B;
    --text-mute: #565B7E;
    --primary: #5055BE;
    --border:  #E1E6F2;
  }

  body { background: var(--surface); font-family: var(--font-body); color: var(--text); -webkit-font-smoothing: antialiased; }

  .section { padding: 112px var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: 80px; }

  .copy { flex: 0 0 420px; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
  .copy h2 { font-family: var(--font-head); font-weight: 700; font-size: 2.25rem; line-height: 1.2; letter-spacing: -.01em; }
  .copy p { font-size: 1.0625rem; line-height: 1.6; color: var(--text-mute); }

  .steps { flex: 1; display: flex; flex-direction: column; }
  .step { display: flex; gap: 24px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--border); }
  .step .no { font-family: var(--font-head); font-weight: 700; font-size: 1.75rem; color: var(--primary); width: 48px; flex-shrink: 0; }
  .step h3 { font-family: var(--font-head); font-weight: 600; font-size: 1.375rem; }
  .step p { font-size: 1rem; line-height: 1.5; color: var(--text-mute); }

  .result { margin-top: 28px; margin-left: 72px; width: calc(100% - 72px); box-sizing: border-box; background: var(--alt); border-radius: 24px; padding: 28px 32px; display: flex; align-items: center; gap: 24px; }
  .result-icon { flex-shrink: 0; width: 56px; height: 56px; border-radius: 16px; background: rgba(80,85,190,.12); color: var(--primary); display: flex; align-items: center; justify-content: center; }
  .result h3 { font-family: var(--font-head); font-weight: 600; font-size: 1.375rem; color: var(--text); margin-bottom: 6px; }
  .result p { font-size: 1rem; line-height: 1.5; color: var(--text-mute); }

  .fade-up { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .fade-up { transition: opacity .3s ease; transform: none; } }

  @media (max-width: 1024px) {
    .section { flex-direction: column; padding: 80px 32px; gap: 40px; }
    .copy { flex: none; max-width: 100%; text-align: center; align-items: center; }
    .result { margin-left: 0; width: 100%; }
  }

  @media (max-width: 620px) {
    .section { padding: 68px 20px; }
    .copy h2 { font-size: 1.75rem; }
    .result { flex-direction: column; text-align: center; padding: 24px; }
  }
</style>
</head>
<body>

<section class="section">
  <div class="copy fade-up">
    <h2>Як почати</h2>
    <p>Три прості кроки від першої заявки до сесії</p>
  </div>

  <div class="steps fade-up" style="transition-delay:.1s">
    <div class="step">
      <div class="no">01</div>
      <div><h3>Заявка</h3><p>Коротка форма з запитом</p></div>
    </div>
    <div class="step">
      <div class="no">02</div>
      <div><h3>Бронювання</h3><p>Обираєте час для розмови</p></div>
    </div>
    <div class="step" style="border-bottom:none">
      <div class="no">03</div>
      <div><h3>Безкоштовна консультація</h3><p>Відбувається онлайн через Google Meet</p></div>
    </div>

    <div class="result">
      <div class="result-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg></div>
      <div><h3>Покроковий план</h3><p>Це буде наш результат розмови: рекомендації під ваш запит</p></div>
    </div>
  </div>
</section>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
