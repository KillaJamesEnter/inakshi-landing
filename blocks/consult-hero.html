<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інакші — Індивідуальні консультації · Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font-head: 'Geologica', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;

    --bg:        #F5F9FF;
    --surface:   #FFFFFF;
    --text:      #1B1550;
    --text-mute: #565B7E;
    --primary:   #5055BE;
    --primary-2: #4A63E8;
    --primary-a12: rgba(80, 85, 190, .12);
    --border:    #E1E6F2;

    --r-pill: 999px;
  }

  body {
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Nav ── */
  nav {
    position: fixed; inset: 0 0 auto 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 40px;
    background: rgba(245, 249, 255, .82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .logo { display: inline-flex; flex-direction: column; line-height: 1.1; text-decoration: none; }
  .logo .role {
    font-family: var(--font-body);
    font-weight: 800; font-size: .64rem;
    text-transform: uppercase; letter-spacing: .12em;
    color: var(--text-mute);
  }
  .logo .name {
    font-family: var(--font-head);
    font-weight: 700; font-size: 1rem;
    color: var(--primary); letter-spacing: -.01em;
  }
  .logo:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

  /* ── Button (gradient pill) ── */
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-body); font-weight: 700; font-size: 1rem;
    color: #fff; text-decoration: none; border: none; cursor: pointer;
    padding: 15px 34px; border-radius: var(--r-pill);
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    box-shadow: 0 12px 30px rgba(80, 85, 190, .32);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(80, 85, 190, .42); }
  .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .btn--sm { padding: 10px 22px; font-size: .9rem; box-shadow: 0 8px 22px rgba(80, 85, 190, .28); }

  /* ── Hero ── */
  .hero {
    position: relative; overflow: hidden;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 150px 24px 96px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(100px); pointer-events: none; z-index: 0;
  }
  .hero::before { width: 560px; height: 560px; background: rgba(80, 85, 190, .16); top: -160px; left: -130px; }
  .hero::after  { width: 440px; height: 440px; background: rgba(130, 86, 224, .12); right: -130px; bottom: -120px; }

  .hero-inner { position: relative; z-index: 1; max-width: 720px; display: flex; flex-direction: column; align-items: center; }

  .eyebrow {
    font-family: var(--font-body);
    font-weight: 800; font-size: .76rem;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--primary);
    background: var(--primary-a12);
    padding: 8px 16px; border-radius: var(--r-pill);
    margin-bottom: 28px;
  }

  h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.85rem);
    line-height: 1.16;
    letter-spacing: -.02em;
    color: var(--text);
    text-wrap: balance;
    margin-bottom: 36px;
  }
  h1 .hl { color: var(--primary); }

  .hero-note {
    margin-top: 18px;
    font-size: .92rem;
    color: var(--text-mute);
  }

  /* ── Fade-up on load ── */
  .fade-up { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .fade-up { transition: opacity .3s ease; transform: none; }
    .btn:hover { transform: none; }
  }

  @media (max-width: 700px) {
    nav { padding: 14px 20px; }
    .btn--sm { padding: 9px 18px; font-size: .82rem; }
    .logo .name { font-size: .9rem; }
    .logo .role { font-size: .58rem; }
    .hero { padding: 128px 20px 72px; }
    .eyebrow { margin-bottom: 22px; }
  }
</style>
</head>
<body>

<nav>
  <a href="https://inakshi.in.ua" class="logo">
    <span class="role">Психолог</span>
    <span class="name">Віталій Медведєв</span>
  </a>
  <!-- ANKETA_URL: підставити реальне посилання на первинну анкету -->
  <a href="ANKETA_URL" class="btn btn--sm">Заповнити анкету</a>
</nav>

<section class="hero">
  <div class="hero-inner">
    <span class="eyebrow fade-up">Індивідуальна терапія</span>

    <h1 class="fade-up" style="transition-delay:.12s">
      Розібратися з тим,<br>
      що <span class="hl">не відпускає</span>
    </h1>

    <a href="ANKETA_URL" class="btn fade-up" style="transition-delay:.24s">Заповнити анкету</a>

    <p class="hero-note fade-up" style="transition-delay:.34s">Це ще не запис і ні до чого не зобов'язує.</p>
  </div>
</section>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
