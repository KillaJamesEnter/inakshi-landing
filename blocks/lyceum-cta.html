<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інакші — Ліцеї · CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400..900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font-head: 'Geologica', system-ui, sans-serif;
    --gutter: max(24px, calc((100% - 1248px) / 2));
    --font-body: 'Nunito', system-ui, sans-serif;

    --bg:      #F5F9FF;
    --alt:     #EBEEF8;
    --primary-2: #4A6CF5;
    --dark-1:  #1B1550;
    --dark-2:  #332B7A;
  }

  body { background: var(--bg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  .section { padding: 64px var(--gutter); display: flex; align-items: center; background: var(--alt); }

  .panel {
    width: 100%; box-sizing: border-box; background: linear-gradient(135deg, var(--dark-1), var(--dark-2)); border-radius: 32px;
    padding: 56px 64px; display: flex; align-items: center; justify-content: space-between; gap: 48px; flex-wrap: wrap;
  }
  .panel h2 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 2.25rem; line-height: 1.2; color: #fff; }
  .panel h2 .hl { color: var(--primary-2); }
  .panel p { margin: 10px 0 0; font-size: 1.1875rem; line-height: 1.6; color: #C9CEF0; }

  .btn {
    flex-shrink: 0; background: #fff; color: var(--dark-1); text-decoration: none; border-radius: 999px;
    padding: 20px 40px; font-family: var(--font-body); font-weight: 700; font-size: 1.125rem; line-height: 1; white-space: nowrap;
    transition: transform .18s ease, box-shadow .18s ease; box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(0,0,0,.24); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .fade-up { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .fade-up { transition: opacity .3s ease; transform: none; } .btn:hover { transform: none; } }

  @media (max-width: 1024px) {
    .section { padding: 32px 32px; }
    .panel { padding: 48px 40px; flex-direction: column; text-align: center; gap: 28px; }
  }

  @media (max-width: 620px) {
    .section { padding: 24px 20px; }
    .panel { padding: 40px 28px; border-radius: 24px; }
    .panel h2 { font-size: 1.75rem; }
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<section class="section">
  <div class="panel fade-up">
    <div>
      <h2>Почніть <span class="hl">сьогодні</span></h2>
      <p>Отримайте рекомендації, з чого почати зміни у вашому ліцеї.</p>
    </div>
    <!-- CONSULT_URL: підставити реальне посилання на безкоштовну консультацію -->
    <a href="CONSULT_URL" class="btn">Безкоштовна консультація</a>
  </div>
</section>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
