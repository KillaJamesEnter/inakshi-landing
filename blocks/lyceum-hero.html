<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інакші — Ліцеї · Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400..900&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font-head: 'Geologica', system-ui, sans-serif;
    --gutter: max(24px, calc((100% - 1248px) / 2));
    --font-body: 'Nunito', system-ui, sans-serif;

    --bg:        #F5F9FF;
    --surface:   #FFFFFF;
    --alt:       #EBEEF8;
    --text:      #14132B;
    --text-mute: #565B7E;
    --primary:   #5055BE;
    --primary-2: #4A6CF5;
    --border:    #E1E6F2;

    --r-pill: 999px;
  }

  body {
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Nav (ідентично основному ленду) ── */
  nav {
    position: fixed; inset: 0 0 auto 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    background: rgba(245, 249, 255, .82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .logo { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; }
  .logo .mark {
    font-family: var(--font-head); font-weight: 700; font-size: 1.15rem;
    color: var(--primary); letter-spacing: -.01em;
  }
  .logo:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

  /* ── Button (gradient pill) ── */
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-body); font-weight: 700; font-size: 1rem;
    color: #fff; text-decoration: none; border: none; cursor: pointer;
    padding: 16px 32px; border-radius: var(--r-pill); white-space: nowrap;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    box-shadow: 0 12px 30px rgba(80, 85, 190, .28);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(80, 85, 190, .38); }
  .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .btn--sm { padding: 11px 24px; font-size: .9rem; box-shadow: 0 8px 22px rgba(80, 85, 190, .24); }

  /* ── Hero ── */
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex; align-items: center; justify-content: space-between; gap: 64px;
    padding: 148px var(--gutter) 104px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(100px); pointer-events: none; z-index: 0;
  }
  .hero::before { width: 560px; height: 560px; background: rgba(80, 85, 190, .16); top: -160px; left: -130px; }
  .hero::after  { width: 440px; height: 440px; background: rgba(130, 86, 224, .12); right: -130px; bottom: -110px; }
  .hero-copy, .hero-visual { position: relative; z-index: 1; }

  .hero-copy { max-width: 580px; display: flex; flex-direction: column; gap: 24px; }

  .eyebrow {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: .8125rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--primary);
    white-space: nowrap;
  }

  h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(2.1rem, 4.4vw, 3.5rem);
    line-height: 1.1;
    letter-spacing: -.01em;
    color: var(--text);
  }
  h1 .hl { color: var(--primary); }

  .hero-features { display: flex; flex-wrap: wrap; gap: 10px; }
  .hf-tag {
    display: inline-flex; align-items: center; white-space: nowrap;
    padding: 9px 18px; border-radius: var(--r-pill);
    background: rgba(80, 85, 190, .1); color: var(--primary);
    font-family: var(--font-head); font-weight: 700; font-size: .875rem;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .hf-tag:hover { transform: translateY(-3px); background: rgba(80, 85, 190, .18); box-shadow: 0 8px 18px rgba(80, 85, 190, .18); }
  @media (prefers-reduced-motion: reduce) { .hf-tag:hover { transform: none; } }

  .hero-visual {
    flex-shrink: 0;
    width: 640px; max-width: 46vw; aspect-ratio: 640 / 520;
    border-radius: 24px;
    background: linear-gradient(160deg, #C9D6F2, #8E9BD6);
    box-shadow: 0 24px 48px rgba(80, 85, 190, .16);
    overflow: hidden;
  }
  .hero-visual video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ── Fade-up on load ── */
  .fade-up { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .fade-up { transition: opacity .3s ease; transform: none; }
    .btn:hover { transform: none; }
  }

  @media (max-width: 1024px) {
    nav { padding: 20px 32px; }
    .hero { flex-direction: column-reverse; padding: 136px 32px 64px; gap: 48px; text-align: center; }
    .hero-copy { align-items: center; max-width: 100%; }
    .hero-visual { width: 100%; max-width: 480px; aspect-ratio: 640 / 400; }
  }

  @media (max-width: 620px) {
    nav { padding: 12px 18px; }
    .btn--sm { padding: 9px 18px; font-size: .82rem; }
    .hero { padding: 116px 20px 48px; }
    .eyebrow { font-size: .7rem; letter-spacing: .1em; }
  }
</style>
</head>
<body>

<nav>
  <a href="https://inakshi.in.ua" class="logo">
    <span class="mark">Інакші</span>
  </a>
  <!-- CONSULT_URL: підставити реальне посилання на безкоштовну консультацію -->
  <a href="CONSULT_URL" class="btn btn--sm">Безкоштовна консультація</a>
</nav>

<section class="hero">
  <div class="hero-copy">
    <div class="eyebrow fade-up">Психологічна турбота для ліцеїв онлайн</div>
    <h1 class="fade-up" style="transition-delay:.05s">Опора там, де зростає <span class="hl">покоління</span></h1>
    <div class="hero-features fade-up" style="transition-delay:.15s">
      <span class="hf-tag">Учні</span>
      <span class="hf-tag">Педагоги</span>
      <span class="hf-tag">Адміністрація</span>
      <span class="hf-tag">Керівництво</span>
    </div>
    <div class="fade-up" style="transition-delay:.25s">
      <a href="CONSULT_URL" class="btn">Безкоштовна консультація</a>
    </div>
  </div>
  <div class="hero-visual fade-up" style="transition-delay:.2s">
    <video src="assets/hero-video.mp4" autoplay muted loop playsinline aria-label="Ленд ліцей"></video>
  </div>
</section>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
